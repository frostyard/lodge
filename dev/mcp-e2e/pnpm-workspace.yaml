# The store stays inside the nsl machine (dev/nsl/provision.sh); without this
# pnpm puts it beside the project, in the host's home directory.
storeDir: /var/tmp/lodge/pnpm-store
packageImportMethod: copy
# MCP Inspector's postinstall installs its clients' dependencies in a source
# checkout, and does nothing as a dependency: it does not run.
allowBuilds:
  "@modelcontextprotocol/inspector": false
