# lodge's runtime and state directories (docs/specs/app-contract.md,
# Install layout). /run/lodge holds lodge's control, inference and agent
# sockets, which lodge makes; the apps' sockets in /run/lodge/apps are made
# by their systemd socket units, so only root writes there. lodge's state
# is its own, 0700.
d /run/lodge 0755 lodge lodge -
d /run/lodge/apps 0755 root root -
d /var/lib/lodge 0700 lodge lodge -
