# lodge's user and groups (docs/specs/app-contract.md, Install layout).
# User lodge, in its own group lodge, which owns the apps' sockets. Every
# app's user joins lodge-apps (for inference), never lodge. lodge joins
# lodge-apps too, to give the inference socket that group, and
# lodge-agents, to give the agent socket that group. An agent on this host,
# such as Porter, joins lodge-agents, and is named in /etc/lodge/config.json.
# Each app's own sysusers.d entry repeats the line below byte for byte, so
# that its daemon (the kit's lodgeapp.LoadEnv, which looks user lodge up)
# resolves it without lodge's sysext (docs/specs/app-contract.md, Install
# layout). Change the line only together with every app: systemd-sysusers
# warns on two different lines for one user, and keeps only the first.
u lodge - "lodge, the tailnet web shell for frostyard's apps" /var/lib/lodge
g lodge-apps -
m lodge lodge-apps
g lodge-agents -
m lodge lodge-agents
