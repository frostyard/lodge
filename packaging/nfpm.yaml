# nFPM config for frostyard-lodge (frostyard/core ADR-0011, ADR-0058). make deb
# stages the tree and runs nfpm; the Version comes from DEB_VERSION.
name: frostyard-lodge
arch: amd64
platform: linux
version: ${DEB_VERSION}
version_schema: none
section: net
priority: optional
maintainer: Brian Ketelsen <bketelsen@gmail.com>
description: |-
  lodge, the tailnet-only web shell for frostyard's first-party apps.
  It gives frostnotes, frostmail, frostread and Porter one address, a
  quick switcher and the shared inference layer. Built for Snosi's
  sysext lodge (ADR-0058).
vendor: frostyard
homepage: https://github.com/frostyard/lodge
license: MIT
depends:
  - systemd
contents:
  - src: ./build/deb/root/usr
    dst: /usr
    type: tree
