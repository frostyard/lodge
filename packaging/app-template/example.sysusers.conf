# A lodge app's system user, for an app to copy as
# /usr/lib/sysusers.d/<app>.conf. The user may use lodge's inference socket
# (group lodge-apps), and is never in group lodge. An app that is also an
# agent on lodge's host, reaching other apps' /mcp/<id> on the agent socket,
# adds "m frostexample lodge-agents" and is named in agents in
# /etc/lodge/config.json.
# Group lodge owns the app socket (SocketGroup=lodge). This file declares the
# group too, so that the socket starts without lodge's own sysext (core
# ADR-0058). The user is never a member of group lodge.
g lodge -
u frostexample - "the example app, behind lodge" /var/lib/frostexample
m frostexample lodge-apps
