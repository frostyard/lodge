# CI: the jobs of `make ci`, which runs the same gates on a developer's
# machine. Actions are pinned to full commit SHAs and jobs get only the
# permissions they need (frostyard/core ADR-0021, checked by
# internal/workflowcheck); tools come from go.mod and mise.lock (ADR-0043).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 6 * * *" # nightly, so upstream drift surfaces within a day
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (make verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The locked golangci-lint, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: golangci-lint
          cache: true
      - name: Tidy, vet, format, lint and tests
        run: make verify

  # The kit has !linux tests, and frostmail runs the kit on Windows.
  kit-windows:
    name: The kit off Linux (go test on Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Fixtures and golden files are byte-exact: no CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kit/go.mod
      - name: The kit's tests, its off-Linux tests among them
        working-directory: kit
        run: go test ./...

  race:
    name: Race detector and cross-builds (make race cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Race detector
        run: make race
      - name: linux/amd64 and linux/arm64 builds
        run: make cross

  vulncheck:
    name: Vulnerabilities (make vulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The govulncheck version is pinned, and the Go checksum database verifies the module.
      - name: govulncheck
        run: make vulncheck

  client:
    name: lodge-client (make client-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by client/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make client-check IN_NSL='sh -c'

  ui:
    name: lodge-ui (make ui-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by ui/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make ui-check IN_NSL='sh -c'

  shell:
    name: the shell (make shell-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by shell/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make shell-check IN_NSL='sh -c'

  deb:
    name: Snapshot .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The locked nFPM, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by shell/package.json.
      - run: corepack enable
      - name: Build the shell
        run: make shell-build IN_NSL='sh -c'
      # deb-check runs inside make deb.
      - name: Build and check the snapshot .deb
        run: make deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
