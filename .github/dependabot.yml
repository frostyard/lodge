# Dependabot (frostyard/core ADR-0071, ADR-0075 and ADR-0089, baseline row
# B13): exactly 1 entry for each ecosystem with a manifest here, its
# manifests' directories in that entry's directories list, a monthly
# schedule, and 1 catch-all group. Each ecosystem then opens at most 1
# version-update PR a month for all its directories. Security updates stay
# ungrouped and immediate (no applies-to). internal/workflowcheck checks it.
#
# The kit (kit/go.mod) is a module that the apps import: an update there
# reaches them with the next kit/vX.Y.Z tag. The npm entry updates the
# client, the UI package, the shell and the end-to-end tests' pins in 1 PR;
# their lockfiles build and test in the nsl machine (make client-check,
# ui-check, shell-check), as CI does.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
# @types/node follows the Node major of NODE_VERSION; internal/workflowcheck
# checks it, and a Node major moves by hand with its types. The ignore
# covers every directory of the npm entry; dev/mcp-e2e has no @types/node.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /
      - /kit
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /client
      - /ui
      - /shell
      - /dev/mcp-e2e
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
