# Dependabot (frostyard/core ADR-0071, baseline row B13): 1 entry for each
# ecosystem with a manifest here. internal/workflowcheck checks the list.
#
# The kit (kit/go.mod) is a module that the apps import: an update there
# reaches them with the next kit/vX.Y.Z tag. The npm entries update the
# client, the UI package and the shell; their lockfiles build and test in
# the nsl machine (make client-check, ui-check, shell-check), as CI does.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /kit
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      kit-go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      client-npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      ui-npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /shell
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      shell-npm:
        patterns: ["*"]
